server:
  port: 8082

spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/iprody-lms
  datasource: # параметры подключения к БД
#    url: jdbc:postgresql://postgres:5432/payment-db # URL подключения к БД
    url: jdbc:postgresql://localhost:5432/payment-db # URL подключения к БД
#    username: admin
#    password: secret
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver  # класс jdbc драйвера
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true # показывать sql запросы в консоли
    properties:
      hibernate:
        format_sql: true  # форматировать sql для читабельности
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9093

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: xpayment-adapter-result-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.iprody.payment.service.app.async.XPaymentAdapterResponseMessage"

    listener:
      ack-mode: manual
      concurrency: 1

app:
  kafka:
    topics:
      x-payment-adapter:
        request: xpayment-adapter.requests
        response: xpayment-adapter.responses

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.data: INFO
    com.iprody.payment: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,liquibase,beans,metrics,env,loggers.